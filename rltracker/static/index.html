<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=Saira:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800;1,900&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link id="themeCss" rel="stylesheet" href="/static/themes/rlcs.css">
<link rel="stylesheet" href="/static/themes/common.css">
<script>
  // Theme: "rlcs" (default) or "arena" (the original look). Saved per browser.
  (function(){ var t = 'rlcs';
    try { t = localStorage.getItem('rltracker.theme') || 'rlcs'; } catch (e) {}
    if (['rlcs','arena','light','contrast'].indexOf(t) < 0) t = 'rlcs';
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeCss').href = '/static/themes/' + t + '.css'; })();
</script>
</head>
<body>
<header>
  <div class="logo"><span>RL</span><b>Tracker</b><i>Stat Log</i></div>
  <nav>
    <button data-view="home" class="on">Home</button>
    <button data-view="stats">Stats</button>
    <button data-view="history">Games</button>
    <button data-view="sessions">Sessions</button>
    <button data-view="people">People</button>
    <button data-view="records">Records</button>
    <button data-view="settings">Settings</button>
  </nav>
  <button class="updbadge" id="updBadge" hidden title="A new version of RL Tracker is ready">⬆ Update available</button>
  <button class="searchbtn" id="searchBtn" title="Find any stat, page or player">🔍 Search <kbd>Ctrl K</kbd></button>
  <div id="status"><span class="dot"></span><span id="statusText">…</span></div>
</header>
<div id="gbar"></div>
<main id="view"></main>
<div id="palette"></div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="hzoom"><div class="hzbox" id="hzbox"></div></div>
<div id="toast"></div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const api = async (url, opts={}) => {
  const r = await fetch(url, {headers:{'Content-Type':'application/json'}, ...opts});
  if (!r.ok) throw new Error(r.status);
  return r.json();
};
// ---- theme helpers ----
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const themePalette = () => ['--c1','--c2','--c3','--c4','--c5'].map(v => cssVar(v) || '#ffffff');
const currentTheme = () => document.documentElement.getAttribute('data-theme') || 'rlcs';
function setTheme(t){
  try { localStorage.setItem('rltracker.theme', t); } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
  const link = document.getElementById('themeCss');
  link.onload = () => render();   // redraw so charts pick up the new colours
  link.href = '/static/themes/' + t + '.css';
}
const esc = s =>String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label = k => k.replace(/_/g,' ');
const fmtDate = iso => { const d = new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); };
const state = { view:'home', size:'all', ranked:'all', last:0, who:'me', whoName:null, tf:'all', si:0, from:'', to:'', sessList:null, tag:'' };
// dashboard timeframe → query string (all / last N / date range / one session)
function dashQ(){
  const q = new URLSearchParams({size: state.size, ranked: state.ranked, who: state.who});
  if (['10','25','50'].includes(state.tf)) q.set('last', state.tf);
  if (state.tf==='range'){ if (state.from) q.set('start', state.from+'T00:00:00'); if (state.to) q.set('end', state.to+'T23:59:59'); }
  const ss = state.sessList && state.sessList[state.si];
  if (state.tf==='session' && ss){ q.set('start', ss.start); q.set('end', ss.end); }
  if (state.tag) q.set('tag', state.tag);
  return q.toString();
}
// dashboard wording: 'Your …' for you (all accounts or one), 'Alex's …' when viewing someone else
const isMe = () => state.who==='me' || String(state.who).startsWith('me:');
const yourW = () => isMe() || !state.whoName ? 'Your' : `${state.whoName}'s`;
const youW = () => isMe() || !state.whoName ? 'You' : state.whoName;
let charts = [];

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',3500); }

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x===b));
  state.view = b.dataset.view; render();
});

function render(){ charts.forEach(c=>c.destroy()); charts=[];
  const view = state.view;
  const run = () => ({home:renderHome, stats:renderStats, people:renderPeople, sessions:renderSessions, records:renderRecords,
                      history:renderHistory, settings:renderSettings})[view]();
  if (FILTER_VIEWS[view]) ensureMeta().then(()=>{ if (state.view===view){ drawGbar(); run(); } });
  else { drawGbar(); run(); } }

// redraw the current page in the background without jumping to the top: hold the page height while cards reload,
// and put the scroll back where it was (stops as soon as you scroll yourself)
function softRender(){
  const y = window.scrollY, v = $('#view'); v.style.minHeight = v.offsetHeight + 'px';
  render();
  let moved = false; const mark = () => { moved = true; };
  const evs = ['wheel','touchstart','keydown','mousedown']; evs.forEach(e => addEventListener(e, mark, {passive:true}));
  const t0 = Date.now();
  const tick = () => {
    if (moved || Date.now() - t0 > 5000){ v.style.minHeight = ''; evs.forEach(e => removeEventListener(e, mark)); return; }
    if (Math.abs(window.scrollY - y) > 2) window.scrollTo(0, y);
    requestAnimationFrame(tick); };
  tick();
}
function who(p){ const k = p.key; return p.alias ? `<b>${P(k, p.alias)}</b> <span class="hint">${esc(p.name)}</span>` : P(k, p.name); }
function resultBadge(r){ return `<span class="res ${r||'n'}">${r||'–'}</span>`; }
function scoreLine(row){
  if (!row.score_line || row.score_line.length<2) return '';
  let idx = [0,1];
  if (row.my_team === 1) idx = [1,0];
  return `<span class="sc"><span class="${row.colors[idx[0]]}">${row.score_line[idx[0]] ?? '?'}</span> – <span class="${row.colors[idx[1]]}">${row.score_line[idx[1]] ?? '?'}</span></span>`;
}
function chipGroup(key, opts){
  return `<div class="chips">${opts.map(([v,t])=>`<button data-k="${key}" data-v="${v}" class="${String(state[key])===String(v)?'on':''}">${t}</button>`).join('')}</div>`;
}
function bindChips(){ document.querySelectorAll('.chips button[data-k]').forEach(b=>b.onclick=()=>{ state[b.dataset.k]= isNaN(+b.dataset.v)||b.dataset.v==='' ? b.dataset.v : +b.dataset.v; render(); });
  const w = $('#dashWho'); if (w) w.onchange = e => { state.who = e.target.value; render(); };
  const tf = $('#dashTf'); if (tf) tf.onchange = e => { state.tf = e.target.value; if (state.tf==='session') state.sessList = null; render(); };
  const f = $('#dashFrom'); if (f) f.onchange = e => { state.from = e.target.value; render(); };
  const t = $('#dashTo'); if (t) t.onchange = e => { state.to = e.target.value; render(); };
  const ss = $('#dashSess'); if (ss) ss.onchange = e => { state.si = +e.target.value; render(); };
  const tg = $('#dashTag'); if (tg) tg.onchange = e => { state.tag = e.target.value; render(); }; }

// ------------------------------------------------------------------ dashboard
async function renderDash(){
  if (state.tf==='session' && !state.sessList) state.sessList = (await api('/api/sessions')).sessions;
  const [s, tagList] = await Promise.all([api(`/api/summary?${dashQ()}`), api('/api/tags').catch(()=>[])]);
  state.who = s.who; state.whoName = isMe() ? null : s.me_display;
  if (state.tag && !tagList.some(t=>t.tag===state.tag)) state.tag = '';
  if (state.view !== 'stats') return;  // user switched tabs while loading
  const v = $('#statsBody') || $('#view');
  const sizes = [['all','All'], ...s.playlists.map(p=>[p,p])];
  const filters = `<div class="filters">
    ${chipGroup('size', sizes)}
    ${chipGroup('ranked', [['all','All'],['ranked','Ranked'],['casual','Casual']])}
    <div class="row" style="gap:8px"><label class="hint" for="dashTf">Timeframe</label>
      <select class="e name" id="dashTf" style="width:auto">${[['all','All time'],['10','Last 10 games'],['25','Last 25 games'],['50','Last 50 games'],['range','Date range'],['session','A session']].map(([v,t])=>`<option value="${v}" ${state.tf===v?'selected':''}>${t}</option>`).join('')}</select>
      ${state.tf==='range' ? `<input type="date" class="e name" id="dashFrom" value="${state.from}" style="width:150px"> to <input type="date" class="e name" id="dashTo" value="${state.to}" style="width:150px">` : ''}
      ${state.tf==='session' && state.sessList ? `<select class="e name" id="dashSess" style="width:auto">${state.sessList.map((x,i)=>`<option value="${i}" ${state.si===i?'selected':''}>${fmtDay(x.start)} ${fmtTime(x.start)} · ${x.games} games · ${x.wins}–${x.losses}</option>`).join('')}</select>` : ''}</div>
    <div class="me">${s.me.length || s.who!=='me' ? `<label class="hint" for="dashWho">Viewing</label>
      <select class="e name" id="dashWho" style="width:auto;margin-left:6px">${s.viewers.map(v=>`<option value="${esc(v.key)}" ${v.key===s.who?'selected':''}>${esc(v.label)}${v.key==='me'?' (you)':v.account?' · your account':''} · ${v.games} g</option>`).join('')}</select>
      ${s.who==='me' && s.me.length > 1 ? ` <span class="hint">· ${s.me.length} accounts</span>` : ''}` : `<span class="bad">Set your in-game name in Settings</span>`}</div>
    ${tagList.length || state.tag ? `<div class="row" style="gap:8px"><label class="hint" for="dashTag">Tag</label>
      <select class="e name" id="dashTag" style="width:auto"><option value="">Any</option>${tagList.map(t=>`<option value="${esc(t.tag)}" ${state.tag===t.tag?'selected':''}>${esc(t.tag)} · ${t.games} g</option>`).join('')}</select></div>` : ''}
    <button class="btn" id="dashCustomBtn" title="Hide, show and reorder the Dashboard cards">Customise</button>
  </div>`;
  if (!s.games){
    v.innerHTML = `<div class="card empty">No matches found for you yet.<br><br>
      Save the replay at the end of a match (or turn on automatic replay saving in Rocket League) and it shows up here within a few seconds.
      ${s.unmatched ? `<br><br>${s.unmatched} games were read but your name wasn't found in them. Check your name in Settings.`:''}</div>`;
    bindChips(); return;
  }
  const avg = s.averages, lob = s.lobby_averages;
  const tile = (lab, val, sub='') => `<div class="card tile"><div class="label">${lab}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
  const vsLobby = k => { if (avg[k]==null || lob[k]==null) return ''; const d = avg[k]-lob[k]; return `<span class="${d>=0?'up':'down'}">${d>=0?'+':''}${d.toFixed(1)}</span> vs lobby avg`; };
  const tiles = [
    tile('Games', s.games, `${s.wins}W – ${s.losses}L`),
    tile('Win rate', s.win_rate!=null ? s.win_rate+'%' : '–', s.streak.kind ? `<span class="${s.streak.kind==='W'?'up':'down'}">${s.streak.n} ${s.streak.kind==='W'?'win':'loss'} streak</span>`:''),
    tile('Avg score', avg.score?.toFixed(0) ?? '–', vsLobby('score')),
    avg.goals!=null ? tile('Goals / game', avg.goals.toFixed(2), vsLobby('goals')) : '',
    avg.assists!=null ? tile('Assists / game', avg.assists.toFixed(2), vsLobby('assists')) : '',
    avg.saves!=null ? tile('Saves / game', avg.saves.toFixed(2), vsLobby('saves')) : '',
    s.shooting_pct!=null ? tile('Shooting %', s.shooting_pct+'%', `${s.totals.goals} goals / ${s.totals.shots} shots`) : '',
    s.goal_participation ? tile('Goal participation', s.goal_participation.pct+'%', `scored or assisted ${s.goal_participation.involved} of the team's ${s.goal_participation.team_goals} goals`) : '',
    tile('MVPs', s.mvps, s.wins ? `${(100*s.mvps/s.wins).toFixed(0)}% of wins` : 'only awarded on wins'),
  ].join('');

  const statKeys = Object.keys(avg).filter(k=>k!=='score');
  const cmpRows = statKeys.map(k => {
    const a = avg[k], l = lob[k] ?? 0, max = Math.max(a, l, 0.01)*1.15;
    return `<div class="statrow"><div class="k">${label(k)}</div>
      <div class="cmp" title="You ${a} · lobby ${l}"><i style="width:${100*a/max}%"></i><s style="left:${100*l/max}%"></s></div>
      <div class="v">${a.toFixed(2)}</div></div>`;
  }).join('');

  const recent = s.recent.map(r => `<tr class="click" data-id="${r.id}">
      <td>${resultBadge(r.result)} <span class="hint">${fmtDate(r.played_at)}</span></td>
      <td>${r.playlist}${r.ranked?'<span class="tag">ranked</span>':''}</td>
      <td>${scoreLine(r)}</td>
      <td>${r.my?.stats?.score ?? '–'}</td><td>${r.my?.stats?.goals ?? '–'}</td><td>${r.my?.stats?.saves ?? '–'}</td>
      </tr>`).join('');
  const people = (list) => list.length ? `<table><tr><th>Player</th><th>Games</th><th>Win %</th><th>Avg pts</th></tr>${list.map(e=>`<tr><td class="nm">${who(e)}</td><td>${e.games}</td><td>${Math.round(100*e.wins/e.games)}%</td><td>${e.averages?.score?.toFixed(0) ?? '–'}</td></tr>`).join('')}</table>` : '<div class="hint">Nobody seen twice yet.</div>';
  const bests = Object.entries(s.bests).filter(([k])=>k!=='ping').map(([k,b])=>`<tr class="click" data-id="${b.match_id}"><td class="l" style="text-transform:capitalize">${label(k)}</td><td><b>${b.value}</b></td><td class="hint">${fmtDate(b.played_at)}</td></tr>`).join('');

  // Scorebug-style record bar (shown by the RLCS theme, hidden by Arena).
  const streakTxt = s.streak.kind ? `${s.streak.n} ${s.streak.kind==='W'?'win':'loss'} streak` : 'no streak';
  const hero = `<div class="hero">
      <div class="side w"><div class="cap">Wins</div><div class="num">${s.wins}</div></div>
      <div class="mid"><div class="who">${esc(s.me_display || 'You')}</div>
        <div class="meta"><b>${s.win_rate ?? '–'}%</b> win rate · ${streakTxt} · ${s.games} games</div></div>
      <div class="side l"><div class="num">${s.losses}</div><div class="cap">Losses</div></div>
    </div>`;
  v.innerHTML = `<div id="dashCustom"></div><div id="dashCards">
    <section class="dcard" data-card="overview" data-title="Overview tiles"><div class="grid tiles">${tiles}</div></section>
    <section class="dcard" data-card="score" data-title="Score per game">
      <div class="card"><h3>Score per game <span class="hint" style="font-weight:400">· click a bar to open that game · ${esc(youW())} vs the lobby for every stat is on the All stats tab</span></h3><canvas id="scoreChart" height="70"></canvas></div>
    </section>
    <section class="dcard" data-card="recent" data-title="Recent matches · bests · teammates"><div class="grid two">
      <div class="card"><h3>Recent matches</h3><table><tr><th>Result</th><th>Mode</th><th>Score</th><th>Pts</th><th>Goals</th><th>Saves</th></tr>${recent}</table></div>
      <div class="grid" style="align-content:start">
        <div class="card"><h3>Teammates</h3>${people(s.teammates)}</div>
        <div class="card"><div class="hint">Personal bests are on the <span class="plink" id="toRecords">Records</span> page.</div></div>
      </div>
    </div></section>
    <div id="dashExtra"></div></div>`;
  bindChips();
  if ($('#toRecords')) $('#toRecords').onclick = () => go('records');
  if ($('#dashCustomBtn')) $('#dashCustomBtn').onclick = ()=>{ const h = $('#dashCustom'); if (h.dataset.open){ delete h.dataset.open; h.innerHTML = ''; } else renderDashCustom(); };
  if (state.dashLayout === undefined){ try { state.dashLayout = (await api('/api/settings')).dash_layout || null; } catch(e){ state.dashLayout = null; } }
  applyDashLayout();
  v.querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>openGame(+tr.dataset.id));

  Chart.defaults.color = cssVar('--muted'); Chart.defaults.borderColor = cssVar('--chart-grid');
  Chart.defaults.font.family = cssVar('--display'); Chart.defaults.font.size = 13;
  const rec = [...s.recent].reverse();
  charts.push(new Chart($('#scoreChart'), { type:'bar',
    data:{ labels: rec.map(r=>fmtDate(r.played_at)), datasets:[{ label:'Score', data: rec.map(r=>r.my?.stats?.score ?? 0),
      backgroundColor: rec.map(r=> r.result==='W' ? 'rgba(47,211,138,.85)' : r.result==='L' ? 'rgba(255,77,106,.8)' : '#2e3d66') }] },
    options:{ plugins:{legend:{display:false}}, scales:{x:{ticks:{display:false}}},
      onClick:(e,els)=>{ if(els[0]) openGame(rec[els[0].index].id); } } }));
  renderDashExtras();
}

// ------------------------------------------------------------------ matches
// ------------------------------------------------------------------ team
const T = { lineup:'', size:'all', ranked:'all' };
// Player colours come from the active theme (--c1..--c5) plus a few extras.
const PCOL = new Proxy([], { get:(t,k)=> k==='length' ? 8 : [...themePalette(),'#ff9f5a','#7aa2ff','#f0f0f0'][k] });
const num = (v, d=2) => v==null ? '–' : String(parseFloat((+v).toFixed(d)));
const sign = (v, d=2) => v==null ? '–' : `<span class="${v>0?'up':v<0?'down':''}">${v>0?'+':''}${num(v,d)}</span>`;

async function renderTeam(){
  T.size = state.size; T.ranked = state.ranked;  // from the filter bar
  const t = await api(`/api/team?lineup=${encodeURIComponent(T.lineup)}&size=${T.size}&ranked=${T.ranked}`);
  if (state.view !== 'people' || PP.tab !== 'team') return;
  T.lineup = t.lineup;
  const v = $('#peopleBody') || $('#view');
  const sel = `<select class="e name" id="tline" style="width:auto;min-width:240px">
      <option value="any" ${t.lineup==='any'?'selected':''}>Every game I played</option>
      ${t.lineups.map(l=>`<option value="${esc(l.key)}" ${l.key===t.lineup?'selected':''}>With ${esc(l.label)} (${l.wins}–${l.games-l.wins})</option>`).join('')}</select>`;
  const chips = (key, opts) => `<div class="chips" data-t="${key}">${opts.map(([val,txt])=>`<button data-v="${val}" class="${T[key]===val?'on':''}">${txt}</button>`).join('')}</div>`;
  const filters = `<div class="filters">${sel}<span class="hint">Mode and ranked come from the filter bar above.</span></div>`;
  if (!t.games){ v.innerHTML = filters + `<div class="card empty">No finished games for this lineup and filter.</div>`; bindTeam(); return; }

  const keys = t.columns.map(c=>c.key);
  const lab = k => t.columns.find(c=>c.key===k)?.label || label(k);
  const byKey = (arr, k) => arr.find(r=>r.key===k) || {};
  const d = k => k==='score' ? 0 : k==='ball_hits' ? 1 : 2;

  const tiles = `<div class="card tile"><div class="label">Record</div><div class="val">${t.wins}–${t.losses}</div><div class="sub">${t.win_rate}% · ${t.games} games</div></div>` +
    t.overall.map(r=>`<div class="card tile"><div class="label">${esc(lab(r.key))} per game</div>
      <div class="trio">
        <div><small>Us</small><b>${num(r.us, d(r.key))}</b></div>
        <div><small>Them</small><b>${num(r.them, d(r.key))}</b></div>
        <div><small>+/-</small><b>${sign(r.diff, d(r.key))}</b></div>
      </div>
      <div class="sub">more than them in ${r.won_pct ?? '–'}% of games</div></div>`).join('');
  const totalTiles = `<div class="card tile"><div class="label">Games</div><div class="val">${t.games}</div><div class="sub">${t.wins} wins · ${t.losses} losses</div></div>` +
    t.overall.map(r=>`<div class="card tile"><div class="label">${esc(lab(r.key))} total</div>
      <div class="trio">
        <div><small>Us</small><b>${num(r.us_total, 0)}</b></div>
        <div><small>Them</small><b>${num(r.them_total, 0)}</b></div>
        <div><small>+/-</small><b>${sign(r.diff_total, 0)}</b></div>
      </div>
      <div class="sub">across all ${t.games} games</div></div>`).join('');

  const scale = Math.max(...t.overall.map(r=>Math.abs(r.diff||0)/Math.max(Math.abs(r.them||0),1e-9)), 0.01);
  const vsRows = t.overall.map(r=>{
    const rel = r.diff==null ? 0 : r.diff/Math.max(Math.abs(r.them||0),1e-9);
    const w = Math.min(50, Math.abs(rel)*50/scale);
    const wi = byKey(t.in_wins, r.key).diff, lo = byKey(t.in_losses, r.key).diff;
    return `<tr><td class="l">${esc(lab(r.key))}</td><td>${num(r.us,1)}</td><td>${num(r.them,1)}</td><td><b>${sign(r.diff,1)}</b></td>
      <td style="width:28%"><div class="div"><s></s><i class="${rel>=0?'pos':'neg'}" style="${rel>=0?`left:50%;width:${w}%`:`right:50%;width:${w}%`}"></i></div></td>
      <td>${t.wins?sign(wi,1):'–'}</td><td>${t.losses?sign(lo,1):'–'}</td></tr>`;
  }).join('');

  const gameRows = t.per_game.map(g=>`<tr class="click" data-id="${g.id}"><td class="l">${fmtDate(g.played_at)}</td><td>${resultBadge(g.result)}</td>
      ${keys.map(k=>`<td><div class="hint">${g.us[k] ?? '–'}–${g.them[k] ?? '–'}</div><div><b>${sign(g.diff[k],0)}</b></div></td>`).join('')}</tr>`).join('');
  const avgRow = `<tr><td class="l"><b>Average</b></td><td></td>${keys.map(k=>`<td><b>${sign(byKey(t.overall,k).diff,1)}</b></td>`).join('')}</tr>`;

  const pc = i => PCOL[i % PCOL.length];
  const pname = (p,i) => `<span class="pdot" style="background:${pc(i)}"></span>${P(p.key, p.label)}${p.is_me?' <span class="youtag">YOU</span>':''}`;
  const playerRows = t.players.map((p,i)=>`<tr><td class="nm">${pname(p,i)}</td><td>${p.games}</td><td>${p.mvps}</td>

      return `<tr><td class="l">${esc(l)}</td><td>${rsFmt(k,o.us)}</td><td>${rsFmt(k,o.them)}</td><td><b>${rsSign(k,o.diff)}</b></td>

function teamInsights(t, lab){
  const out = [];
  const rel = r => r.diff/Math.max(Math.abs(r.them||0),1e-9);
  const vs = t.overall.filter(r=>r.diff!=null && r.key!=='score');
  if (vs.length){
    const best = [...vs].sort((a,b)=>rel(b)-rel(a))[0], worst = [...vs].sort((a,b)=>rel(a)-rel(b))[0];
    if (best.diff > 0) out.push(`Biggest edge over the other team: <b>${esc(lab(best.key))}</b> (${sign(best.diff,1)} per game).`);
    if (worst.diff < 0) out.push(`Biggest deficit against the other team: <b>${esc(lab(worst.key))}</b> (${sign(worst.diff,1)} per game).`);
  }
  if (t.wins && t.losses){
    const swings = t.overall.filter(r=>r.key!=='score' && r.key!=='goals').map(r=>({k:r.key, w:t.in_wins.find(x=>x.key===r.key).diff, l:t.in_losses.find(x=>x.key===r.key).diff}))
      .filter(x=>x.w!=null && x.l!=null).sort((a,b)=>(b.w-b.l)-(a.w-a.l));
    if (swings.length){ const s = swings[0];
      out.push(`${esc(lab(s.k))} tracks the result most: ${sign(s.w,1)} vs the other team in wins, ${sign(s.l,1)} in losses.`); }
    const ns = t.overall.filter(r=>r.key!=='score' && r.key!=='goals' && r.diff!=null).map(r=>({k:r.key, w:t.in_wins.find(x=>x.key===r.key).diff}))
      .filter(x=>x.w!=null && x.w<0);
    ns.forEach(x=>out.push(`Even in wins we're behind on ${esc(lab(x.k).toLowerCase())} (${sign(x.w,1)} per game).`));
  }
  return out.map(x=>`<li>${x}</li>`).join('');
}

async function openGame(id){

  const cols = m.columns.filter(c=>c.key!=='ping');
  const tot = (t,k) => { if (k==='goals' && t.score!=null) return t.score; const v=t.players.map(p=>p.stats[k]).filter(x=>x!=null); return v.length? v.reduce((a,b)=>a+b,0) : null; };

      ${cols.map(c=>{ const a=tot(us,c.key), b=tot(them,c.key); return `<tr><td class="l">${esc(c.label)}${c.key==='goals'?' <span class="hint">(final score)</span>':''}</td><td>${a ?? '–'}</td><td>${b ?? '–'}</td><td><b>${a!=null&&b!=null?sign(a-b,0):'–'}</b></td></tr>`; }).join('')}</table>` : '';

    ${gameTabsHtml(m, `${replayBar(m)}${notesCardHtml(m)}${scoreboard(m)}

    if (H.replayOnly && !m.has_replay) return false;
    if (H.result!=='all' && m.result!==H.result) return false;
    if (H.mode!=='all' && m.playlist!==H.mode) return false;
    if (H.ranked==='ranked' && !m.ranked) return false;
    if (H.ranked==='casual' && m.ranked) return false;
    const day = m.played_at.slice(0,10);
    if (H.from && day < H.from) return false;
    if (H.to && day > H.to) return false;
    const ps = m.teams.flatMap(t=>t.players);
    if (q && !ps.some(p=>p.name.toLowerCase().includes(q) || (p.alias||'').toLowerCase().includes(q))) return false;
    if (H.withP){ const mine = m.my_index ? m.teams[m.my_index[0]].players : []; if (!mine.some(p=>p.alias===H.withP)) return false; }
    return true;
  });
  const key = SORTS[H.sort];
  rows.sort((a,b)=>{ const x=key(a), y=key(b); if (x==null && y==null) return 0; if (x==null) return 1; if (y==null) return -1; return (x<y?-1:x>y?1:0)*H.dir; });

  const w = rows.filter(m=>m.result==='W').length, l = rows.filter(m=>m.result==='L').length;
  const pts = rows.map(m=>myP(m)?.stats.score).filter(x=>x!=null);
  $('#hsum').innerHTML = `<b>${rows.length}</b> games · <span class="up">${w}W</span> – <span class="down">${l}L</span>${w+l?` · ${(100*w/(w+l)).toFixed(0)}% win rate`:''}${pts.length?` · ${(pts.reduce((a,b)=>a+b,0)/pts.length).toFixed(0)} avg pts`:''} · click a game to see its scoreboard`;

  const head = [['date','Date','l'],['result','Result',''],['mode','Mode','l'],['margin','Score','l'],['score','Pts',''],['goals','G',''],['assists','A',''],['ball_hits','BH',''],['saves','Sv',''],['shots','Sh',''],['demos','D',''],[null,'Team','l'],[null,'','l']];
  const NC = head.length;
  const body = rows.map(m=>{
    const p = myP(m), mates = m.my_index ? m.teams[m.my_index[0]].players.filter((_,i)=>i!==m.my_index[1]).map(x=>P(x.key, x.alias||x.name)).join(', ') : '';
    const flags = [m.has_replay?'replay ✓':'', m.hidden?'hidden':'', m.duplicate_of?'duplicate':'', !m.is_final?'mid-game':'', !m.my_index?'you not in it':''].filter(Boolean);
    const open = H.open.has(m.id);
    return `<tr class="click hrow ${open?'opened':''}" data-id="${m.id}" style="${m.hidden||m.duplicate_of?'opacity:.5':''}">
      <td class="l"><span class="caret">${open?'▾':'▸'}</span> ${fmtDate(m.played_at)}</td><td>${resultBadge(m.result)}</td>
      <td class="l">${m.playlist}${m.ranked?'<span class="tag">ranked</span>':''}</td>
      <td class="l">${histScore(m)}</td>
      <td>${p?.stats.score ?? '–'}</td><td>${p?.stats.goals ?? '–'}</td><td>${p?.stats.assists ?? '–'}</td><td>${p?.stats.ball_hits ?? '–'}</td><td>${p?.stats.saves ?? '–'}</td><td>${p?.stats.shots ?? '–'}</td><td>${p?.stats.demos ?? '–'}</td>
      <td class="nm">${mates}</td><td class="l">${flags.map(t=>`<span class="tag">${t}</span>`).join('')}</td></tr>
      ${open?`<tr class="exp"><td colspan="${NC}">${scoreboard(m)}
        <div class="row" style="margin-top:10px"><button class="btn" data-open="${m.id}">Open game</button>
        <button class="btn" data-hide="${m.id}" data-hidden="${m.hidden?1:0}">${m.hidden?'Unhide':'Hide from stats'}</button></div></td></tr>`:''}`;
  }).join('');
  $('#htable').innerHTML = `<tr>${head.map(([k,t,c])=>`<th class="${c} ${k?'sortable':''}" data-sort="${k||''}">${t}${H.sort===k?(H.dir<0?' ▼':' ▲'):''}</th>`).join('')}</tr>${body || `<tr><td colspan="${NC}" class="empty">No games match these filters.</td></tr>`}`;
  document.querySelectorAll('#htable th.sortable').forEach(th=>th.onclick=()=>{ const k=th.dataset.sort; if(H.sort===k) H.dir*=-1; else { H.sort=k; H.dir = k==='mode'||k==='result' ? 1 : -1; } drawHistory(); });
  document.querySelectorAll('#htable tr.hrow').forEach(tr=>tr.onclick=()=>{ const id=+tr.dataset.id; H.open.has(id)?H.open.delete(id):H.open.add(id); drawHistory(); });
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openGame(+b.dataset.open));
  document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=async()=>{ await api(`/api/match/${b.dataset.hide}/hide`,{method:'POST',body:JSON.stringify({hidden:b.dataset.hidden!=='1'})}); renderHistory(); });
}

// Settings › Updates: version, check, one-click update (downloads the release, backs up, restarts)
async function renderUpdateSettings(cfg, force){
  const host = $('#updCard'); if (!host) return;
  let v = {}, u = {};
  try { [v, u] = await Promise.all([api('/api/version'), api('/api/update/check' + (force ? '?force=1' : ''))]); }
  catch(e){ host.innerHTML = '<h3>Updates</h3><div class="hint">Restart RL Tracker to turn on updates.</div>'; return; }
  const status = !u.configured ? '<span class="hint">No update source set yet.</span>'
    : u.error ? `<span class="bad">${esc(u.error)}</span>`
    : u.available ? `<b class="up">Version ${esc(u.latest)} is available.</b>` : `<span class="up">You have the latest version.</span>`;
  host.innerHTML = `<h3>Updates</h3>
    <div class="row" style="gap:10px;flex-wrap:wrap"><span>RL Tracker <b>v${esc(v.version)}</b></span>${status}</div>
    ${u.available && u.notes ? `<div class="card" style="margin-top:8px;background:var(--panel2)"><b>What's new in ${esc(u.latest)}</b><div class="hint" style="white-space:pre-wrap;margin-top:4px">${esc(u.notes)}</div></div>` : ''}
    <div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">
      ${u.available ? '<button class="btn pri" id="updGo">Update now</button>' : ''}
      ${u.configured ? '<button class="btn" id="updCheck">Check again</button>' : ''}</div>
    <div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap"><label class="inl">Update source (GitHub "owner/name")
      <input class="e name" id="updRepo" value="${esc(cfg.update_repo || '')}" placeholder="${esc(v.repo || 'owner/rltracker')}" style="width:220px"></label>
      <button class="btn sm" id="updRepoSave">Save</button></div>
    <div class="hint" style="margin-top:8px">Updating downloads the new version, backs up your database and the current app, replaces only the app's files and restarts it. Your games, settings and backups in the data folder are never touched.</div>`;
  if ($('#updCheck')) $('#updCheck').onclick = () => renderUpdateSettings(cfg, true);
  $('#updRepoSave').onclick = async () => { await api('/api/settings',{method:'PUT',body:JSON.stringify({update_repo: $('#updRepo').value})}); cfg.update_repo = $('#updRepo').value; toast('Update source saved'); renderUpdateSettings(cfg, true); };
  if ($('#updGo')) $('#updGo').onclick = async () => {
    $('#updGo').disabled = true; $('#updGo').textContent = 'Updating…';
    let r; try { r = await api('/api/update/apply', {method:'POST'}); } catch(e){ r = {ok:false, error:'The update could not be started.'}; }
    if (!r.ok){ toast(r.error || 'Update failed'); renderUpdateSettings(cfg, true); return; }
    host.innerHTML = `<h3>Updates</h3><div><b>Updated to v${esc(r.version)}.</b> RL Tracker is restarting; this page reloads by itself in a few seconds.</div>`;
    const want = r.version, t0 = Date.now();
    const wait = async () => { try { const x = await api('/api/version'); if (x.version === want){ location.reload(); return; } } catch(e){}
      if (Date.now() - t0 < 90000) setTimeout(wait, 1500); else host.insertAdjacentHTML('beforeend', '<div class="bad" style="margin-top:6px">The app hasn\'t come back yet. Run start.bat to start it.</div>'); };
    setTimeout(wait, 3000);
  };
}

// ---- grades (A+ … F) and the session report card
const gradeBadge = (g, cls='') => g ? `<span class="grade g-${g.letter[0]} ${cls}" title="${esc(g.word)} · ${g.pts}/100">${g.letter}</span>` : '';
const noteText = n => n.text || `${STAT_LABEL[n.stat]||n.stat} ${n.change>0?'+':''}${n.change}% vs your usual`;
function reportCard(s){
  const R = s.report; if (!R || !R.grade) return '';
  const dec = k => k==='score' ? 0 : k==='ball_hits' ? 1 : 2;
  const rows = STATS.map(k=>{ const x = R.stats[k] || {};
    return `<tr><td class="l">${STAT_LABEL[k]}</td><td><b>${num(x.avg, dec(k))}</b></td><td class="hint">${num(x.usual, dec(k))}</td>
      <td>${x.change==null?'–':`<span class="${x.change>0?'up':x.change<0?'down':''}">${x.change>0?'+':''}${x.change}%</span>`}</td><td>${gradeBadge(x.grade,'sm')}</td></tr>`; }).join('');
  const notes = R.notes.length ? R.notes.map(n=>`<li class="${n.kind==='up'?'up':'down'}">${esc(noteText(n))}</li>`).join('') : '<li class="hint">A normal session for you: nothing stood out.</li>';
  const diff = R.difficulty ? `<div class="hint" style="margin-top:6px">Lobbies: <b class="diff-${R.difficulty.tier}">${R.difficulty.tier}</b> (opponents ${num(R.difficulty.strength,0)} on average)</div>` : '';
  const el = R.early_late;
  const elHtml = el ? `<div class="rc-el"><div><small>First ${el.early.games} games</small><b>${pct(el.early.win_rate)}</b><span class="hint">${num(el.early.score,0)} pts/game</span></div>
      <div><small>Last ${el.late.games} games</small><b>${pct(el.late.win_rate)}</b><span class="hint">${num(el.late.score,0)} pts/game</span></div></div>` : '';
  const mates = R.mates.length ? `<div class="hint" style="margin-top:8px">With: ${R.mates.map(m=>`${esc(m.name)} <b style="color:var(--text)">${m.wins}–${m.games-m.wins}</b>`).join(' · ')}</div>` : '';
  return `<div class="rc">
    <div class="rc-left">${gradeBadge(R.grade,'big')}<div class="rc-word">${esc(R.grade.word)}</div>
      <div class="hint">Stats ${gradeBadge(R.stats_grade,'sm')} · Wins ${gradeBadge(R.win_grade,'sm')}</div>

// the same session for your whole team: team totals per game against your teams' usual in the same mode(s)
function teamReportCard(s){
  const T = s.report && s.report.team; if (!T || !T.grade) return '';
  const dec = k => k==='score' ? 0 : 1;
  const rows = STATS.map(k=>{ const x = T.stats[k] || {};
    return `<tr><td class="l">${STAT_LABEL[k]}</td><td><b>${num(x.v, dec(k))}</b></td><td class="hint">${num(x.usual, dec(k))}</td>
      <td>${x.change==null?'–':`<span class="${x.change>0?'up':x.change<0?'down':''}">${x.change>0?'+':''}${x.change}%</span>`}</td><td>${gradeBadge(x.grade,'sm')}</td></tr>`; }).join('');
  const vs = STATS.filter(k=>T.diff && T.diff[k]!=null).map(k=>`${STAT_LABEL[k]} <b class="${T.diff[k]>0?'up':T.diff[k]<0?'down':''}">${T.diff[k]>0?'+':''}${num(T.diff[k], dec(k))}</b>`).join(' · ');
  const notes = T.notes.length ? T.notes.map(n=>`<li class="${n.kind}">${esc(n.text)}</li>`).join('') : '<li class="hint">A normal session for the team: nothing stood out.</li>';
  return `<div class="rc rc-team">
    <div class="rc-left">${gradeBadge(T.grade,'big')}<div class="rc-word">${esc(T.grade.word)}</div>
      <div class="hint">Stats ${gradeBadge(T.stats_grade,'sm')} · Wins ${gradeBadge(T.win_grade,'sm')}</div></div>
    <div class="rc-mid"><h3>Team report card</h3><ul class="ins">${notes}</ul>
      <div class="hint" style="margin-top:8px">Per game vs the other team: ${vs || '–'}</div>
      <div class="hint" style="margin-top:6px">Your team's totals per game, compared with your teams in the same mode outside this session${T.estimated ? ' (estimated where there were few earlier games in that mode)' : ''}.</div></div>
    <div class="rc-right"><table><tr><th>Team stat / game</th><th>Session</th><th>Usual</th><th>Change</th><th></th></tr>${rows}</table></div>
  </div>`;
}
function bindSessions(d){
  $('#saveCutoff').onclick = async ()=>{ await api('/api/settings',{method:'PUT',body:JSON.stringify({session_cutoff_min:+$('#cutoff').value||45})}); renderSessions(); };
  $('#openLive').onclick = openLive;
  if ($('#openWeek')) $('#openWeek').onclick = ()=>openWeekReport();
  document.querySelectorAll('[data-sess]').forEach(h=>h.onclick=()=>{ const i=+h.dataset.sess; S.open.has(i)?S.open.delete(i):S.open.add(i); renderSessions(true); });
  document.querySelectorAll('[data-sreport]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); openSessionReport(d.sessions[+b.dataset.sreport]); });
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async e=>{ e.stopPropagation();
    try { await navigator.clipboard.writeText(d.sessions[+b.dataset.copy].summary); toast('Copied — paste it in Discord'); }
    catch(err){ prompt('Copy this:', d.sessions[+b.dataset.copy].summary); } });
  document.querySelectorAll('#view tr[data-id]').forEach(tr=>tr.onclick=()=>openGame(+tr.dataset.id));
  document.querySelectorAll('#view [data-gid]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); openGame(+b.dataset.gid); });
  document.querySelectorAll('#view [data-stag]').forEach(inp=>{ inp.onclick = e => e.stopPropagation();
    inp.onkeydown = async e => { if (e.key!=='Enter' || !inp.value.trim()) return; const sx = d.sessions[+inp.dataset.stag];
      await api('/api/notes/bulk', {method:'POST', body:JSON.stringify({ids: sx.rows.map(r=>r.id), add:[inp.value]})});
      toast(`Tagged ${sx.rows.length} games "${inp.value.trim().toLowerCase()}"`); inp.value=''; }; });
}

    </div>${sm.saves_by.length ? `<div class="hint" style="margin-top:8px">Saves on these shots: ${sm.saves_by.map(x=>`<b style="color:var(--text)">${esc(x.name)}</b> ${x.saves}`).join(' · ')}</div>` : ''}`;
  const o = { dates:true, title:'Shot map', col: x => x.side==='against' ? 'var(--orange)' : 'var(--blue)', goalCls: x => x.side==='against' ? 'down' : 'up',
    legend: 'Your goal is at the bottom in every game; <span style="color:var(--blue)">blue</span> = your team\'s shots, <span style="color:var(--orange)">orange</span> = shots against.', side,
    keep: (x, f) => f==='against' ? x.side==='against' : f==='ga' ? x.side==='against' && x.outcome==='goal'
      : f==='for' ? x.side==='for' : f==='mine' ? x.mine : f==='gm' ? x.mine && x.outcome==='goal' : true,

async function openReport(url, name, wait){
  const key = url, box = $('#mbox');
  box.innerHTML = `<div class="row"><h3 style="margin:0">${name}</h3><div class="spacer"></div><button class="btn" id="srClose">Close</button></div>
    <div class="card" style="margin-top:12px"><div class="hint">${wait} this takes a few seconds.</div></div>`;
  $('#modal').classList.add('on'); $('#modal').scrollTop = 0; $('#srClose').onclick = closeModal;
  if (!SREP.has(key)) SREP.set(key, api(url));
  let r; try { r = await SREP.get(key); } catch(e){ SREP.delete(key); box.querySelector('.card').innerHTML = '<div class="bad">Could not build the report. Restart RL Tracker if it was just updated.</div>'; return; }
  if (!$('#modal').classList.contains('on')) return;
  const W = r.kind === 'week' ? r.week : null;
  const lastDay = iso => { const d = new Date(iso); return fmtDay(d.toISOString()); };
  const wkNav = W ? `<button class="btn sm" id="wkPrev" title="Previous week">◀</button><button class="btn sm" id="wkNext" title="Next week" ${W.is_current?'disabled':''}>▶</button>` : '';
  const bindWk = () => { if (!W) return; $('#wkPrev').onclick = ()=>openWeekReport(W.prev_start); if (!W.is_current) $('#wkNext').onclick = ()=>openWeekReport(W.next_start); };
  if (!r.games){
    box.innerHTML = `<div class="row"><h3 style="margin:0">${name}${W ? ` · ${fmtDay(W.start)} – ${lastDay(W.end)}` : ''}</h3><div class="spacer"></div>${wkNav}<button class="btn" id="srClose">Close</button></div>
      <div class="card" style="margin-top:12px"><div class="hint">No games ${W ? 'this week' : 'in this session'}.</div></div>`;
    $('#srClose').onclick = closeModal; bindWk(); return;
  }
  const strip = r.results.map(g=>`<span class="fdot ${g.r==='W'?'w':'l'} click" data-id="${g.id}" title="${g.for ?? '?'}–${g.against ?? '?'}">${g.r}</span>`).join('');
  const caveat = r.thin_modes.length ? `<div class="srnote"><b>How to read the grades.</b> There were few earlier ${r.thin_modes.map(esc).join(' / ')} games before this ${W ? "week" : "session"}, so "your usual" in that mode is estimated. The findings below compare the ${W ? "week" : "session"} with itself, the other team and the lobby instead.</div>` : '';
  const facts = f => f.facts.map(x=>`<span class="srfact ${x.kind}">${esc(x.label)}: <b>${esc(x.value)}</b></span>`).join('');
  const finding = f => `<article class="srfix"><div class="srrank">${f.rank}</div><div>
      <h3>${esc(f.title)}</h3><div class="srfacts">${facts(f)}</div><p class="hint">${esc(f.text)}</p>
      <p class="srtry"><b>Try:</b> ${esc(f.tip)}</p></div></article>`;
  const list = (fs, empty) => fs.length ? fs.map(finding).join('') : `<div class="card"><div class="hint">${empty}</div></div>`;
  const well = xs => xs.length ? `<div class="card"><h3>What went well</h3><ul class="srwell">${xs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
  const T = r.team;
  const tierCol = t => t==='Easy' ? 'var(--win)' : t==='Tough' ? 'var(--loss)' : 'var(--muted)';
  const tiers = T.tiers.filter(t=>t.games).map(t=>`<div class="srtier"><span>${esc(t.tier)}</span><div class="track"><i style="width:${t.win_rate}%;background:${tierCol(t.tier)}"></i></div><span>${t.wins}–${t.losses}</span></div>`).join('');
  const wc = T.win_conditions.length ? `<div class="card" style="margin-top:12px"><h3>What went with winning</h3><table>${T.win_conditions.map(w=>`<tr><td class="l">${esc(w.label)}</td><td><b>${esc(w.value)}</b></td></tr>`).join('')}</table>
      <div class="hint" style="margin-top:6px">The split that best separated wins from losses in this session, for each stat. It shows what went with winning, not proof of cause.</div></div>` : '';
  const pv = r.prev;
  const fmtVs = x => x.pct_unit ? pct(x.v) : num(x.v, Math.abs(x.v) >= 100 ? 0 : 2);
  const weekCard = W ? `<div class="card" style="margin-bottom:12px"><h3>This week vs last week</h3>
      <div class="srfacts">
        <span class="srfact">This week: <b>${r.wins}–${r.losses}</b> (${pct(100*r.wins/r.games)}) over ${r.sessions} session${r.sessions===1?'':'s'}</span>
        ${pv ? `<span class="srfact ${r.wins/r.games >= pv.wins/pv.games ? 'up' : 'down'}">Last week: <b>${pv.wins}–${pv.losses}</b> (${pct(pv.win_rate)})</span>
        <span class="srfact">Goals: <b>${r.goals_for}–${r.goals_against}</b> this week, ${pv.goals_for}–${pv.goals_against} last week</span>` : '<span class="srfact">No games last week to compare with.</span>'}</div>
      ${r.vs_last_week.length ? `<table class="wkvs" style="margin-top:10px"><tr><th class="l">${isMe()?'You':'Stat'}</th><th>This week</th><th>Last week</th></tr>
        ${r.vs_last_week.map(x=>`<tr><td class="l">${esc(x.label)}</td><td class="${x.better===true?'better':x.better===false?'worse':''}"><b>${fmtVs({v:x.this, pct_unit:x.pct_unit})}</b></td><td class="hint">${fmtVs({v:x.last, pct_unit:x.pct_unit})}</td></tr>`).join('')}</table>
        <div class="hint" style="margin-top:6px">Your averages per game. Green = better than last week, red = worse.</div>` : ''}
      ${r.days.length > 1 ? `<div class="hint" style="margin-top:8px">By day: ${r.days.map(d=>`${fmtDay(d.date+'T12:00:00')} ${d.wins}–${d.losses}`).join(' · ')}</div>` : ''}</div>` : '';
  const teamPane = weekCard + `<h3 class="sect">What to work on, most important first</h3>${list(T.findings, 'Nothing stood out as a clear problem for the team this session.')}
    ${well(T.went_well)}
    <div class="grid two" style="margin-top:12px">${T.by_minute.length ? minuteDiffHtml(T.by_minute, r.games) : ''}
      ${tiers ? `<div class="card" style="margin-top:12px"><h3>Win rate by lobby strength</h3>${tiers}<div class="hint" style="margin-top:8px">One-goal games ${T.clutch.close.wins}–${T.clutch.close.losses} · overtime ${T.clutch.overtime.wins}–${T.clutch.overtime.losses}</div></div>` : ''}</div>
    ${wc}`;
  const pbarCls = x => x.good==null ? 'n' : x.good>=60 ? 'g' : x.good<=40 ? 'b' : 'm';
  const playerPane = p => `<h3 class="sect">What ${p.key==='me' ? 'you' : esc(p.label)} can work on</h3>${list(p.findings, 'Nothing stood out as a clear problem this session.')}
    ${well(p.went_well)}
    <div class="card" style="margin-top:12px"><h3>${p.key==='me' ? 'Your' : esc(p.label) + "'s"} numbers this session</h3><div style="overflow-x:auto"><table class="stt">
      <tr><th class="l">Stat</th><th>Session</th><th>Usual</th><th>Avg teammate</th><th>Lobby</th><th style="min-width:130px">Percentile</th></tr>
      ${p.table.map(x=>`<tr><td class="l">${esc(x.label)}</td><td><b>${esc(x.session)}</b></td><td class="hint">${esc(x.usual)}</td><td>${esc(x.mates)}</td><td>${esc(x.lobby)}</td>
        <td>${x.pct==null ? '–' : `<div class="pwrap"><div class="pbar"><i class="${pbarCls(x)}" style="width:${x.pct}%"></i></div><span>${x.pct}${ordSuffix(x.pct)}</span></div>`}</td></tr>`).join('')}
    </table></div><div class="hint" style="margin-top:6px">"Usual" = this player's other games. Percentile bars: green = good for this stat, red = bad (for stats where lower is better, a low rank is green).</div></div>`;
  const panes = [['team','Team', teamPane], ...r.players.map(p=>[`p_${p.key}`, p.key==='me' ? `${esc(p.label)} (you)` : esc(p.label), playerPane(p)])];
  const title = W ? `Weekly recap · ${fmtDay(W.start)} – ${lastDay(W.end)}` : `Session report · ${fmtDay(r.start)} ${fmtTime(r.start)} – ${fmtTime(r.end)}`;
  box.innerHTML = `<div class="row"><div><h3 style="margin:0">${title}</h3>
      <div class="hint">${r.games} games · ${Object.entries(r.modes).map(([m,n])=>`${esc(m)} × ${n}`).join(', ')} · ${W ? `${r.sessions} session${r.sessions===1?'':'s'}` : `${Math.floor(r.minutes/60)} h ${r.minutes%60} min`} · goals ${r.goals_for}–${r.goals_against}${r.difficulty!=null?` · lobbies ${num(r.difficulty,0)} on average`:''}</div></div>
      <div class="spacer"></div><div class="srrec"><span class="up">${r.wins}W</span> – <span class="down">${r.losses}L</span></div>${wkNav}<button class="btn" id="srClose">Close</button></div>
    <div class="form" style="margin:10px 0">${strip}</div>${caveat}
    ${tabsHtml('sr', panes, 'team')}`;
  $('#srClose').onclick = closeModal; bindWk();
  bindTabs(box, 'sr');
  box.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openGame(+el.dataset.id));
}

function goalTimingHtml(g){

// ---- why goals happen: goal causes and kinds, xG, team-play habits, roles, giveaway map (from /api/diagnosis)
const DG_CARDS = ['changes','conceded','scored','xg','defending','challenges','teamplay','cutmap','scorestate','mechanics','passing','roles','kickspawn','giveaways','demos','opponents'];
const DG = { give: 'me' };
async function renderDiagnosis(){

const hbar = (v, max, cls='') => `<div class="hb ${cls}"><i style="width:${max ? Math.max(2, 100*v/max) : 0}%"></i></div>`;

function xgHtml(x){

const DGF = (k, v) => v==null ? '–' : k==='recovery_s' ? num(v,1)+' s' : k.startsWith('pct_') || k==='touch_share' ? Math.round(v)+'%' : num(v, k==='boost_def' ? 0 : 2);
function teamPlayHtml(t){

      ${t.rows.map(r=>`<tr><td class="l"><b>${esc(r.label)}</b><div class="hint small">${r.games} games</div></td>${keys.map(k=>cell(k, r[k])).join('')}</tr>`).join('')}

    <div class="hint" style="margin-top:6px">Red = clearly worse than the lobby average, green = clearly better (↓ = lower is better). Double commit: you and a teammate both went for the same ball and both got there, and you started going second. Rotation cut: a teammate was already going and you took the ball off them. Held back: when that happened, how often you pulled out instead (higher is better). Giveaway: a touch in your own or the middle third (not a clear) that the other team picks up and keeps. Recovery time: how long it takes to get back goal-side when the ball is in your half and you're caught in front of it. Boost when the ball comes into your third: how ready you are to defend.</div></div>`;

function radarSvg(labels, series, size=320){
  const n = labels.length, c = size/2, R = size/2 - 54;
  const pt = (i, v) => { const a = -Math.PI/2 + 2*Math.PI*i/n, r = R * (v ?? 0)/100; return [c + r*Math.cos(a), c + r*Math.sin(a)]; };
  const ring = f => labels.map((_,i)=>pt(i, f*100).join(',')).join(' ');
  const grid = [0.25,0.5,0.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--line)" ${f===0.5?'stroke-dasharray="4 4" stroke="var(--line-hi)"':''}/>`).join('');
  const spokes = labels.map((_,i)=>{ const [x,y] = pt(i,100); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; }).join('');
  const labs = labels.map(([ax,l],i)=>{ const [x,y] = pt(i,122); return `<text x="${x}" y="${y+4}" text-anchor="${Math.abs(x-c)<8?'middle':x<c?'end':'start'}" font-size="11" fill="var(--muted)" font-weight="700">${esc(l)}</text>`; }).join('');
  const shapes = series.map(sr=>{ const pts = labels.map(([ax],i)=>pt(i, sr.axes[ax]).join(',')).join(' ');
    const dots = labels.map(([ax],i)=>{ const v = sr.axes[ax]; if (v==null) return ''; const [x,y] = pt(i,v);
      return `<circle cx="${x}" cy="${y}" r="3.5" fill="${sr.color}"><title>${esc(sr.label)} · ${esc(labels[i][1])}: ${v}th percentile</title></circle>`; }).join('');
    return `<polygon points="${pts}" fill="${sr.color}" fill-opacity=".18" stroke="${sr.color}" stroke-width="2"/>${dots}`; }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" class="radar">${grid}${spokes}${shapes}${labs}</svg>`;
}

function calendarHtml(days){
  const map = Object.fromEntries(days.map(d=>[d.date, d]));
  const end = new Date(); end.setHours(0,0,0,0);
  const start = new Date(end); start.setDate(start.getDate() - 7*26 - ((end.getDay()+6)%7));
  const cols = []; let cur = new Date(start);
  while (cur <= end){ const col = []; for (let i=0;i<7;i++){ col.push(new Date(cur)); cur.setDate(cur.getDate()+1); } cols.push(col); }
  const key = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  const cell = dt => { if (dt > end) return '<i class="cal-x"></i>';
    const d = map[key(dt)]; if (!d) return `<i class="cal-0" title="${dt.toDateString()}: no games"></i>`;
    const r = d.wins/d.games, lvl = Math.min(4, d.games);
    const col = r>=0.5 ? `color-mix(in srgb, var(--win) ${30+lvl*17}%, transparent)` : `color-mix(in srgb, var(--loss) ${30+lvl*17}%, transparent)`;
    return `<i class="click" data-day="${key(dt)}" style="background:${col}" title="${dt.toDateString()}: ${d.wins}W–${d.games-d.wins}L — click to see them"></i>`; };
  const months = cols.map((c,i)=> (i===0 || c[0].getMonth()!==cols[i-1][0].getMonth()) ? `<span style="grid-column:${i+1}">${c[0].toLocaleDateString(undefined,{month:'short'})}</span>` : '').join('');
  const older = days.filter(d => new Date(d.date) < start);
  return `<div class="cal"><div class="cal-m" style="grid-template-columns:repeat(${cols.length},14px)">${months}</div>
    <div class="cal-g" style="grid-template-columns:repeat(${cols.length},14px)">${cols.map(c=>c.map(cell).join('')).join('')}</div></div>
    <div class="hint" style="margin-top:8px">Last 26 weeks · green = more wins than losses that day, red = more losses · darker = more games${older.length?` · ${older.reduce((a,d)=>a+d.games,0)} older games not shown`:''}</div>`;
}

// Ternary plot: each player's share of the team's goals / saves / ball hits.
function roleTriangle(players, pc){
  const W=360, H=310, A={x:W/2,y:26}, B={x:30,y:H-36}, C={x:W-30,y:H-36};
  const G={x:(A.x+B.x+C.x)/3, y:(A.y+B.y+C.y)/3};
  const shown = players.filter(p=>p.role);
  const pts = shown.map((p,i)=>{
    const w = p.role.weights, x = w.striker*A.x + w.keeper*B.x + w.playmaker*C.x, y = w.striker*A.y + w.keeper*B.y + w.playmaker*C.y;
    const r = p.role.ratio, pm = p.role.playmaker_from==='ball_hits' ? 'ball hits' : 'score';
    return `<g><circle cx="${x}" cy="${y}" r="9" fill="${pc(players.indexOf(p))}" stroke="var(--bg)" stroke-width="2"/>
      <text x="${i%2 ? x-13 : x+13}" y="${y+4+(i%4>1 ? 14 : 0)}" text-anchor="${i%2?'end':'start'}" fill="var(--text)" font-size="13" font-weight="700">${esc(p.label)}</text>
      <title>${esc(p.label)} — ${esc(p.role.style)}: ${r.striker}× a fair share of goals+shots, ${r.keeper}× of saves, ${r.playmaker}× of ${pm}</title></g>`;
  }).join('');
  const ring = [0.5, 0.75].map(f=>`<polygon points="${[A,B,C].map(v=>`${G.x+(v.x-G.x)*f},${G.y+(v.y-G.y)*f}`).join(' ')}" fill="none" stroke="var(--line)" stroke-dasharray="3 4"/>`).join('');
  const list = shown.map(p=>`<tr><td class="nm"><span class="pdot" style="background:${pc(players.indexOf(p))}"></span>${esc(p.label)}</td><td><b>${esc(p.role.style)}</b></td>
      <td>${p.role.ratio.striker}×</td><td>${p.role.ratio.keeper}×</td><td>${p.role.ratio.playmaker}×</td></tr>`).join('');
  if (!shown.length) return '<div class="hint">Not enough games to place anyone yet.</div>';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:460px;display:block;margin:0 auto">
    <polygon points="${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}" fill="var(--panel2)" stroke="var(--line-hi)"/>${ring}
    ${[A,B,C].map(v=>`<line x1="${v.x}" y1="${v.y}" x2="${G.x}" y2="${G.y}" stroke="var(--line)"/>`).join('')}
    <circle cx="${G.x}" cy="${G.y}" r="3" fill="var(--muted)"/>
    <text x="${A.x}" y="16" text-anchor="middle" fill="var(--muted)" font-size="12" font-weight="700">STRIKER · goals + shots</text>
    <text x="${B.x}" y="${H-12}" text-anchor="start" fill="var(--muted)" font-size="12" font-weight="700">KEEPER · saves</text>
    <text x="${C.x}" y="${H-12}" text-anchor="end" fill="var(--muted)" font-size="12" font-weight="700">ball hits · PLAYMAKER</text>
    ${pts}</svg>
    <table style="margin-top:8px"><tr><th>Player</th><th>Play style</th><th title="Share of the team's goals and shots vs a fair share">Strike</th><th title="Share of the team's saves vs a fair share">Keep</th><th title="Share of the team's ball hits (or score without replays) vs a fair share">Playmake</th></tr>${list}</table>
    <div class="hint" style="margin-top:6px">1.0× = exactly a fair share for the team size, so 2v2 and 3v3 compare fairly. The middle dot is a perfectly even player; the further toward a corner, the more that player leans that way.</div>`;
}

    <div class="grid tiles" style="margin-top:16px">

      ${STATS.map(k=>`<div class="card tile"><div class="label">${STAT_LABEL[k]} / game</div><div class="val">${num(p.averages[k], k==='score'?0:2)}</div><div class="sub">${p.share[k]!=null?`${Math.round(p.share[k])}% of team`:''}</div></div>`).join('')}
    </div>
    ${p.style ? `<h3 class="sect">Play style</h3>${styleCardHtml(p.style, p.is_me ? 'Your radar' : `${esc(p.label)}'s radar`, p.is_me ? 'You' : esc(p.label))}` : ''}
    ${p.rstats_games ? `<h3 class="sect">From replays · ${p.rstats_games} game${p.rstats_games>1?'s':''}</h3>
      ${p.rstats_labels.groups.map(([g, items])=>`<div class="tile label" style="margin:10px 0 6px">${esc(g)}</div>
        <div class="grid tiles">${items.map(([k,l])=>`<div class="card tile"><div class="label">${esc(l)}</div><div class="val" style="font-size:28px">${rsFmt(k, p.rstats[k])}</div></div>`).join('')}</div>`).join('')}
      ${p.heat || Object.keys(p.rotation||{}).length ? `<div class="grid two" style="margin-top:12px">
        ${p.heat ? `<div class="card"><h3>Where ${p.is_me?'you play':'they play'}</h3><div class="heats">${heatHtml(p.heat, 'blue', '', `${p.rstats_games} game${p.rstats_games>1?'s':''}`)}</div><div class="hint" style="margin-top:8px">${HEAT_NOTE}</div></div>` : ''}
        ${Object.keys(p.rotation||{}).length ? `<div class="card"><h3>${p.is_me?'Your':'Their'} team's play</h3>${rotationTable(k=>[rsFmt(k, p.rotation[k])], ['Avg'])}</div>` : ''}</div>` : ''}` : ''}
    <h3 class="sect">Teammate impact</h3><div class="card" id="pImpact"></div>
    <h3 class="sect">Personal bests</h3><div class="grid tiles">${best}</div>
    <h3 class="sect">Recent games</h3>
    <div class="card"><table><tr><th>Date</th><th></th><th>Result</th><th>Score</th>${STATS.map(k=>`<th>${STAT_LABEL[k]}</th>`).join('')}</tr>
      ${p.recent.map(r=>`<tr class="click" data-id="${r.id}"><td class="l">${fmtDate(r.t)}</td><td class="l hint">${r.rel}</td><td>${resultBadge(r.result)}</td><td><span class="sc">${r.for ?? '?'}–${r.against ?? '?'}</span></td>${STATS.map(k=>`<td>${r.stats[k] ?? '–'}</td>`).join('')}</tr>`).join('')}</table></div>`;
  $('#modal').classList.add('on'); $('#modal').scrollTop = 0;
  drawHeats(box);
  loadImpact($('#pImpact'), key);
  $('#pClose').onclick = closeModal;
  if ($('#pAlias')) $('#pAlias').onclick = async ()=>{ const a = prompt(`Alias for ${p.names[0]} (empty to remove):`, p.alias || ''); if (a===null) return;
    await api('/api/alias',{method:'POST',body:JSON.stringify({name:p.names[0], alias:a.trim()})}); toast('Alias saved'); openPlayer(a.trim() ? '@'+a.trim().toLowerCase() : key); render(); };
  box.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openGame(+el.dataset.id));
}

// =================================================================== compare
const C = { a:{type:'session', v:0}, b:{type:'session', v:1}, hist:null, sess:null,
  mode:'players', pa:'me', pb:'', pc:'', pd:'', tf:'all', n:10, from:'', to:'', si:0 };
const cmpModeBar = () => `<div class="filters"><div class="chips" id="cmpMode">
    <button data-m="players" class="${C.mode==='players'?'on':''}">Players (2–4)</button>
    <button data-m="periods" class="${C.mode==='periods'?'on':''}">Two time periods (you)</button></div></div>`;
function bindCmpMode(){ document.querySelectorAll('#cmpMode button').forEach(b=>b.onclick=()=>{ C.mode=b.dataset.m; renderCompare(); }); }
async function renderCompare(){
  if (!C.hist) [C.hist, C.sess] = await Promise.all([api('/api/history'), api('/api/sessions')]);
  if (state.view !== 'people' || PP.tab !== 'compare') return;
  if (C.mode === 'players') return renderComparePlayers();
  const mine = C.hist.filter(m=>m.my_index && !m.hidden && !m.duplicate_of && (m.result==='W'||m.result==='L'));
  const sess = C.sess.sessions;
  const pick = side => {
    const s = C[side];
    const typeSel = `<select class="e name" data-side="${side}" data-f="type" style="width:auto">${[['session','Session'],['game','Single game'],['range','Date range'],['all','All time']].map(([v,t])=>`<option value="${v}" ${s.type===v?'selected':''}>${t}</option>`).join('')}</select>`;
    let val = '';
    if (s.type==='session') val = `<select class="e name" data-side="${side}" data-f="v" style="width:auto">${sess.map((x,i)=>`<option value="${i}" ${+s.v===i?'selected':''}>${fmtDay(x.start)} ${fmtTime(x.start)} · ${x.wins}–${x.losses}</option>`).join('')}</select>`;
    if (s.type==='game') val = `<select class="e name" data-side="${side}" data-f="v" style="width:auto">${[...mine].reverse().map(m=>`<option value="${m.id}" ${+s.v===m.id?'selected':''}>${fmtDate(m.played_at)} · ${m.result} ${histScoreText(m)}</option>`).join('')}</select>`;
    if (s.type==='range') val = `<input type="date" class="e name" data-side="${side}" data-f="from" value="${s.from||''}" style="width:150px"> to <input type="date" class="e name" data-side="${side}" data-f="to" value="${s.to||''}" style="width:150px">`;
    return `<div class="card"><h3>${side.toUpperCase()}</h3><div class="row">${typeSel}${val}</div></div>`;
  };
  const select = s => {
    if (s.type==='all') return mine;
    if (s.type==='game') return mine.filter(m=>m.id===+s.v || (!s.v && m===mine[mine.length-1]));
    if (s.type==='session'){ const x = sess[+s.v||0]; if (!x) return []; const ids = new Set(x.rows.map(r=>r.id)); return mine.filter(m=>ids.has(m.id)); }
    return mine.filter(m=>(!s.from || m.played_at.slice(0,10)>=s.from) && (!s.to || m.played_at.slice(0,10)<=s.to));
  };
  await rsMeta();
  const A = summarize(select(C.a)), B = summarize(select(C.b));
  const rsRow = k => { const a = A.rs[k], b = B.rs[k], d = (a!=null&&b!=null) ? +(a-b).toFixed(2) : null;
    return `<tr><td class="l">${esc(RSM.label[k])}</td><td><b>${rsFmt(k,a)}</b></td><td><b>${rsFmt(k,b)}</b></td><td>${rsSign(k,d)}</td></tr>`; };
  const row = (lab, a, b, d=2, better='high') => { const diff = (a!=null&&b!=null) ? a-b : null;
    const cls = diff==null||diff===0 ? '' : ((diff>0) === (better==='high') ? 'up' : 'down');
    return `<tr><td class="l">${lab}</td><td><b>${num(a,d)}</b></td><td><b>${num(b,d)}</b></td><td class="${cls}">${diff==null?'–':(diff>0?'+':'')+num(diff,d)}</td></tr>`; };
  ($('#peopleBody') || $('#view')).innerHTML = cmpModeBar() + `<div class="grid two" style="grid-template-columns:1fr 1fr;margin-top:0">${pick('a')}${pick('b')}</div>
    <div class="card" style="margin-top:14px"><table class="cmpt"><tr><th>Stat</th><th>A</th><th>B</th><th>A − B</th></tr>
      ${row('Games', A.games, B.games, 0, 'none')}${row('Win %', A.wr, B.wr, 0)}
      <tr class="sub"><td colspan="4">You, per game</td></tr>
      ${STATS.map(k=>row(STAT_LABEL[k], A.my[k], B.my[k], k==='score'?0:2)).join('')}
      ${row('Shooting %', A.shoot, B.shoot, 0)}
      <tr class="sub"><td colspan="4">Team +/- vs opponents, per game</td></tr>
      ${STATS.map(k=>row(STAT_LABEL[k], A.diff[k], B.diff[k], k==='score'?0:2)).join('')}
      <tr class="sub"><td colspan="4">You, from replays, per game · A ${A.rgames} / B ${B.rgames} game${B.rgames===1?'':'s'} with a replay</td></tr>
      ${A.rgames || B.rgames ? CMP_RS.map(rsRow).join('') : `<tr><td colspan="4" class="hint">${RS_EMPTY}</td></tr>`}
    </table><div class="hint" style="margin-top:8px">Green = A is better.</div></div>`;
  bindCmpMode();
  document.querySelectorAll('#view [data-side]').forEach(el=>el.onchange=()=>{ const s=C[el.dataset.side];
    s[el.dataset.f]=el.value; if (el.dataset.f==='type'){ s.v = el.value==='session' ? 0 : el.value==='game' ? (mine[mine.length-1]||{}).id : ''; } renderCompare(); });
}
// ---- two to four players side by side
const CP_COLORS = ['var(--blue)', 'var(--orange)', '#2fbf71', '#b37cff'];
async function renderComparePlayers(){
  const sess = C.sess.sessions || [];
  // timeframe comes from the filter bar
  if (['10','25','50'].includes(state.tf)){ C.tf = 'last'; C.n = +state.tf; }
  else if (state.tf==='range'){ C.tf = 'range'; C.from = state.from; C.to = state.to; }
  else if (state.tf==='session'){ C.tf = 'session'; C.si = state.si; }
  else C.tf = 'all';
  const q = new URLSearchParams({a: C.pa, b: C.pb || ''});
  if (C.pc && C.pc !== C.pa && C.pc !== C.pb){ q.set('c', C.pc);
    if (C.pd && ![C.pa, C.pb, C.pc].includes(C.pd)) q.set('d', C.pd); }
  if (C.tf==='last') q.set('last', C.n);
  if (C.tf==='range'){ if (C.from) q.set('from', C.from); if (C.to) q.set('to', C.to); }
  if (C.tf==='session' && sess[C.si]){ q.set('start', sess[C.si].start); q.set('end', sess[C.si].end); }
  const r = await api('/api/compare_players?' + q);
  if (state.view !== 'people' || PP.tab !== 'compare' || C.mode !== 'players') return;
  if (!C.pb){ C.pb = (r.players.find(p=>p.key!==C.pa)||{}).key || ''; if (C.pb) return renderComparePlayers(); }
  await rsMeta();
  const A = r.a, B = r.b, P = [r.a, r.b, r.c, r.d].filter(Boolean), three = P.length >= 3, nm = x => esc(x.label);
  if (q.has('c') && !r.c || q.has('d') && !r.d) toast('The app needs a restart for more players: close the RL Tracker window and run start.bat again');
  const opt = (sel, none) => (none ? `<option value="" ${!sel?'selected':''}>+ add a ${none} player</option>` : '') +
    r.players.map(p=>`<option value="${esc(p.key)}" ${p.key===sel?'selected':''}>${esc(p.label)}${p.key==='me'?' (you)':p.account?' · your account':''} · ${p.games} g</option>`).join('');
  const tfSel = `<select class="e name" id="cpTf" style="width:auto">${[['all','All time'],['last','Last N games each'],['range','Date range'],['session','A session']].map(([v,t])=>`<option value="${v}" ${C.tf===v?'selected':''}>${t}</option>`).join('')}</select>`;
  let tfVal = '';
  if (C.tf==='last') tfVal = `<select class="e name" id="cpN" style="width:auto">${[5,10,25,50].map(n=>`<option ${C.n===n?'selected':''}>${n}</option>`).join('')}</select>`;
  if (C.tf==='range') tfVal = `<input type="date" class="e name" id="cpFrom" value="${C.from}" style="width:150px"> to <input type="date" class="e name" id="cpTo" value="${C.to}" style="width:150px">`;
  if (C.tf==='session') tfVal = `<select class="e name" id="cpSess" style="width:auto">${sess.map((x,i)=>`<option value="${i}" ${C.si===i?'selected':''}>${fmtDay(x.start)} ${fmtTime(x.start)} · ${x.games} games · ${x.wins}–${x.losses}</option>`).join('')}</select>`;
  const picker = `<div class="card"><div class="row" style="gap:10px;flex-wrap:wrap">
      <select class="e name" id="cpA" style="width:auto">${opt(C.pa)}</select><b>vs</b>
      <select class="e name" id="cpB" style="width:auto">${opt(C.pb)}</select><b>vs</b>
      <select class="e name" id="cpC" style="width:auto">${opt(three ? C.pc : '', 'third')}</select>
      ${three ? `<b>vs</b><select class="e name" id="cpD" style="width:auto">${opt(r.d ? C.pd : '', 'fourth')}</select>` : ''}
      <span class="hint" style="margin-left:10px">Timeframe and players' modes: set in the filter bar above (mode/ranked don't apply here).</span></div></div>`;
  const dec = k => k==='score' ? 0 : 2;
  const pctF = v => Math.round(v)+'%';
  // the best value(s) in a row, by which way is better; none when everyone is level
  const bestOf = (vals, better) => { if (better==='none') return new Set();
    const xs = vals.filter(v=>v!=null); if (xs.length < 2) return new Set();
    const t = better==='low' ? Math.min(...xs) : Math.max(...xs);
    const hit = vals.map((v,i)=>v===t ? i : -1).filter(i=>i>=0); return new Set(hit.length===xs.length ? [] : hit); };
  // a row: one value per player, the best highlighted; with two players also the gap
  const cells = (vals, better, f, diffTxt) => { const best = bestOf(vals, better);
    const gap = vals.length===2 ? `<td>${diffTxt(vals, best)}</td>` : '';
    return vals.map((v,i)=>`<td class="${best.has(i)?'cp-win':''}"><b>${f(v)}</b></td>`).join('') + gap; };
  const row = (lab, vals, d=2, better='high', fmt=null) => {
    const f = v => v==null ? '–' : (fmt ? fmt(v) : num(v, d));
    const diffTxt = ([a,b], best) => { const diff = a!=null && b!=null ? a-b : null; if (diff==null) return '–';
      const win = best.has(0) ? 1 : best.has(1) ? -1 : 0;
      return `<span class="${win>0?'up':win<0?'down':''}">${diff>0?'+':''}${fmt ? fmt(diff) : num(diff, d)}</span>`; };
    return `<tr><td class="l">${lab}</td>${cells(vals, better, f, diffTxt)}</tr>`; };
  const headFor = S => `<tr><th>Stat</th>${S.map(x=>`<th>${nm(x)}</th>`).join('')}${S.length===2 ? `<th>${nm(S[0])} − ${nm(S[1])}</th>` : ''}</tr>`;
  const head = headFor(P), cols = P.length + (three ? 1 : 2);
  const sub = t => `<tr class="sub"><td colspan="${cols}">${t}</td></tr>`;
  const RSK = ['bpm','avg_boost','pct_zero','stolen','avg_speed','pct_supersonic','pct_high_air','aerial_touches','pct_possession','avg_shot_speed','clears','centres','pct_def_third','pct_behind_ball','pct_last_back','avg_dist_ball','whiffs','air_whiffs','pct_whiff'];
  const rsRow = k => { const vals = P.map(S=>S.replay[k]);
    const better = RSM.neutral.has(k) ? 'none' : RSM.lower.has(k) ? 'low' : 'high';
    const diffTxt = ([a,b]) => rsSign(k, a!=null&&b!=null ? +(a-b).toFixed(2) : null);
    return `<tr><td class="l">${esc(RSM.label[k]||k)}</td>${cells(vals, better, v=>rsFmt(k,v), diffTxt)}</tr>`; };
  const h = r.h2h, T = h.together, X = h.against, T3 = h.trio;
  const span = S => S.games ? `${fmtDay(S.first)} – ${fmtDay(S.last)}` : 'no finished games';
  const tile = (S, i) => `<div class="card tile"><div class="label" style="color:${CP_COLORS[i]}">${nm(S)}</div><div class="val">${S.wins}–${S.losses}</div>
      <div class="sub">${S.games} games · ${pct(S.win_rate)} win rate · ${S.mvps} MVPs<br>${span(S)}</div></div>`;
  const h2hRows = (G, keys) => r.stats.map(k=>row(STAT_LABEL[k]||k, keys.map(x=>G[x][k]), dec(k))).join('');
  const styles = [r.style_a, r.style_b, r.style_c, r.style_d].slice(0, P.length);
  const styleCard = styles.every(Boolean) ? `<div class="card" style="margin-top:14px"><h3>Play style · all games</h3><div class="stylewrap">
      <div style="flex:0 0 auto;width:min(340px,100%)">${radarSvg(styles[0].labels, styles.map((st,i)=>({axes:st.axes, color:CP_COLORS[i], label:P[i].label})), 340)}</div>
      <div style="flex:1;min-width:220px"><table><tr><th>Axis</th>${P.map((S,i)=>`<th style="color:${CP_COLORS[i]}">${nm(S)}</th>`).join('')}<th class="l">What it is</th></tr>
        ${styles[0].labels.map(([ax,l])=>`<tr><td class="l">${esc(l)}</td>${styles.map(st=>`<td><b>${st.axes[ax] ?? '–'}</b><span class="hint">${st.axes[ax]!=null?ordSuffix(st.axes[ax]):''} ·${styleRaw(ax, (st.raw||{})[ax])}</span></td>`).join('')}<td class="l hint">${styleAbout(styles[0], ax)}</td></tr>`).join('')}</table>
        <div class="hint" style="margin-top:6px">Big number = percentile of every single-game performance in your games (50 = middle); small number = the player's actual average. Uses all of each player's games, not just this timeframe.</div></div></div></div>` : '';
  const trioCard = three ? `<div class="card" style="margin-top:14px"><h3>All ${P.length===4?'four':'three'} on the same team · ${T3.games} game${T3.games===1?'':'s'}</h3>${T3.games ? `<div class="big-rec">${T3.wins}–${T3.losses} <span class="hint">${pct(T3.win_rate)}</span></div>
        <table class="cmpt">${head}${h2hRows(T3, ['a','b','c','d'].slice(0, P.length))}</table>` : `<div class="hint">Never all on the same team in this timeframe${P.length===4 ? ' (four teammates only happens in 4v4)' : ''}.</div>`}</div>` : '';
  const head2 = headFor([A, B]);
  const body = !P.some(S=>S.games) ? '<div class="card empty">No one picked has finished games in this timeframe.</div>' : `
    <div class="grid" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${P.map(tile).join('')}</div>
    ${styleCard}
    <div class="card" style="margin-top:14px"><table class="cmpt">${head}
      ${row('Win %', P.map(S=>S.win_rate), 0, 'high', pctF)}${row('MVPs', P.map(S=>S.mvps), 0)}
      ${sub('Per game')}${r.stats.map(k=>row(STAT_LABEL[k]||k, P.map(S=>S.avg[k]), dec(k))).join('')}
      ${row('Shooting %', P.map(S=>S.shooting), 0, 'high', pctF)}${row('Goal participation', P.map(S=>S.goal_part), 0, 'high', pctF)}
      ${sub('Share of their team’s total')}${['score','goals','assists','ball_hits','saves','shots','demos'].map(k=>row(STAT_LABEL[k]||k, P.map(S=>S.share[k]), 0, 'high', pctF)).join('')}
      ${sub('Their team vs the other team, per game')}${r.stats.map(k=>row(STAT_LABEL[k]||k, P.map(S=>S.team_diff[k]), dec(k))).join('')}
      ${sub('Best single game')}${r.stats.map(k=>row(STAT_LABEL[k]||k, P.map(S=>S.best[k]), 0)).join('')}
      ${sub(`From replays, per game · ${P.map(S=>S.replay_games).join(' / ')} games`)}${P.some(S=>S.replay_games) ? RSK.map(rsRow).join('') : `<tr><td colspan="${cols}" class="hint">${RS_EMPTY}</td></tr>`}
    </table><div class="hint" style="margin-top:8px">Green = the best number. Each player is counted from their own side: their team, their result.</div></div>
    <h3 class="sect">Head to head${three ? ` · ${nm(A)} and ${nm(B)}` : ''}</h3>
    <div class="grid two" style="margin-top:0">
      <div class="card"><h3>On the same team · ${T.games} game${T.games===1?'':'s'}</h3>${T.games ? `<div class="big-rec">${T.wins}–${T.losses} <span class="hint">${pct(T.win_rate)}</span></div>
        <table class="cmpt">${head2}${h2hRows(T, ['a','b'])}</table>` : '<div class="hint">Never on the same team in this timeframe.</div>'}</div>
      <div class="card"><h3>Against each other · ${X.games} game${X.games===1?'':'s'}</h3>${X.games ? `<div class="big-rec">${nm(A)} ${X.a_wins} – ${X.b_wins} ${nm(B)}</div>
        <table class="cmpt">${head2}${h2hRows(X, ['a','b'])}</table>` : '<div class="hint">Never on opposite teams in this timeframe.</div>'}</div>
    </div>${trioCard}`;
  ($('#peopleBody') || $('#view')).innerHTML = cmpModeBar() + picker + body;
  bindCmpMode();
  $('#cpA').onchange = e => { C.pa = e.target.value; renderComparePlayers(); };
  $('#cpB').onchange = e => { C.pb = e.target.value; renderComparePlayers(); };
  $('#cpC').onchange = e => { C.pc = e.target.value; if (!C.pc) C.pd = ''; renderComparePlayers(); };
  if ($('#cpD')) $('#cpD').onchange = e => { C.pd = e.target.value; renderComparePlayers(); };
  if ($('#cpTf')) $('#cpTf').onchange = e => { C.tf = e.target.value; renderComparePlayers(); };
  if ($('#cpN')) $('#cpN').onchange = e => { C.n = +e.target.value; renderComparePlayers(); };
  if ($('#cpFrom')) $('#cpFrom').onchange = e => { C.from = e.target.value; renderComparePlayers(); };
  if ($('#cpTo')) $('#cpTo').onchange = e => { C.to = e.target.value; renderComparePlayers(); };
  if ($('#cpSess')) $('#cpSess').onchange = e => { C.si = +e.target.value; renderComparePlayers(); };

    const c = v >= 0 ? 'var(--blue)' : 'var(--orange)';

    return `<g><title>${lab(b)}: ball in orange's half ${num(b.blue_attack,0)}% of the time, in blue's half ${num(100-b.blue_attack,0)}%${p!=null?` · possession blue ${num(p,0)}% / orange ${num(100-p,0)}%`:''}</title>

      ${i % Math.ceil(n/10) === 0 || b.ot && !mo[i-1]?.ot ? `<text x="${x + (bw-6)/2}" y="${Hh-14}" text-anchor="middle" font-size="11" fill="var(--muted)">${lab(b)}</text>` : ''}</g>`; }).join('');

function breakdownHtml(m){

      return tg ? Math.round(100*Math.min(tg, (c.p.stats?.goals||0) + (c.p.stats?.assists||0))/tg) : null; }
    const get = p => isMain ? p.stats?.[k] : (p.rstats && 'bpm' in p.rstats ? p.rstats[k] : null);
    if (c.kind==='p') return get(c.p) ?? null;
    if (isMain && k==='goals' && c.t.score!=null) return c.t.score;
    const vs = c.t.players.map(get).filter(v=>v!=null); if (!vs.length) return null;
    if (isMain || sumSet.has(k)) return vs.reduce((a,b)=>a+b,0);

    }).join('')).join('');
  const head = `<tr><th>Stat</th>${cols.map(c=> c.kind==='p'
      ? `<th><span class="pdot" style="background:var(--${c.t.color})"></span>${P(c.p.key, pName(c.p))}</th>`
      : `<th class="bd-team" style="color:var(--${c.t.color})">${esc(c.t.name || c.t.color)} team</th>`).join('')}</tr>`;
  return `<div class="card" style="margin-top:12px"><div class="row" style="flex-wrap:wrap;gap:8px"><h3 style="margin:0">Every stat · players and teams</h3>
      <div class="chips" id="bdChips" style="margin-left:8px"><button data-g="" class="on">All</button>${groups.map(([g])=>`<button data-g="${esc(g)}">${esc(g)}</button>`).join('')}</div></div>
    <div style="overflow-x:auto;margin-top:10px"><table class="bd">${head}${body}</table></div>

      Replay stats only count time with the ball in play (no kickoff countdowns or goal celebrations). Positioning is relative to each player's own goal.</div></div>`;
}
// ---- heatmaps: each team (all its players together) and each player
function heatAvg(list){
  const arrs = list.filter(Boolean).map(b=>{ const bin = atob(b), a = new Float64Array(bin.length/2);
    for (let i=0;i<a.length;i++) a[i] = bin.charCodeAt(2*i) | (bin.charCodeAt(2*i+1)<<8); return a; });
  if (!arrs.length) return null;
  let out = ''; for (let i=0;i<arrs[0].length;i++){ const v = Math.min(65535, Math.round(arrs.reduce((s,a)=>s+a[i],0)/arrs.length)); out += String.fromCharCode(v & 255, v >> 8); }
  return btoa(out);
}

// the field from above with a coloured circle per pad (value shown on it; fmt formats it, who(j) adds to the tooltip)
function padFieldSvg(pads, counts, who=()=>'', fmt=n=>n, unit='pickup'){

      <circle cx="${x}" cy="${-y}" r="${r}" fill="${fill}" fill-opacity="${n?0.92:0}" stroke="${n?'rgba(0,0,0,.35)':'var(--line-hi)'}" stroke-width="${n?30:34}" ${n?'':'stroke-dasharray="40 40"'}/>
      ${n ? `<text x="${x}" y="${-y}" dy="${big?120:88}" text-anchor="middle" font-size="${big?340:250}" font-weight="800" fill="#0b0f18">${fmt(n)}</text>` : ''}</g>`; }).join('');
  return `<svg viewBox="-4400 -5450 8800 10900" class="padsvg">

async function openSearch(){
  const pal = $('#palette'); pal.classList.add('on');
  pal.innerHTML = `<div class="pal-box"><input id="palQ" placeholder="Search stats, pages and players… (e.g. powerslides, heatmap, a teammate's name)" autocomplete="off"><div id="palR"></div>
    <div class="hint small" style="margin-top:6px">↑ ↓ to move · Enter to open · Esc to close</div></div>`;
  const qi = $('#palQ'); qi.focus();
  let items = [], sel = 0;
  const tb = await statTable().catch(()=>null); await ensureMeta();
  const all = [
    ...(tb ? tb.rows.map(r=>({kind:'Stat', text:r.label, sub:`${statFmt(r, r.you)} per game · ${r.group_label}${r.help?' · '+r.help:''}`, hay:`${r.label} ${r.group_label} ${r.help} ${r.key}`, run:()=>goStat(r.key)})) : []),
    ...PAGES.map(([t, view, tab])=>({kind:'Page', text:t, sub:'', hay:t, run:()=>go(view, ()=>{ if (view==='stats' && tab) ST.tab = tab; if (view==='people' && tab) PP.tab = tab; })})),

  ];
  const draw = () => {
    const q = qi.value.trim().toLowerCase(), words = q.split(/\s+/).filter(Boolean);
    const score = it => { const h = it.hay.toLowerCase(), t = it.text.toLowerCase(); if (!words.every(w=>h.includes(w))) return -1;
      return (t.startsWith(q) ? 3 : t.includes(q) ? 2 : 1) + (it.kind==='Stat' ? 0.5 : 0); };
    items = q ? all.map(it=>[score(it), it]).filter(([s])=>s>=0).sort((a,b)=>b[0]-a[0]).map(([,it])=>it).slice(0, 12) : all.filter(it=>it.kind==='Page');
    sel = Math.min(sel, Math.max(0, items.length-1));
    $('#palR').innerHTML = items.map((it,i)=>`<div class="pal-it ${i===sel?'on':''}" data-i="${i}"><span class="pal-k">${it.kind}</span><b>${esc(it.text)}</b><span class="hint small">${esc(it.sub)}</span></div>`).join('') || '<div class="hint" style="padding:10px">Nothing found.</div>';
    $('#palR').querySelectorAll('.pal-it').forEach(el=>el.onclick=()=>pick(+el.dataset.i));
  };

  qi.oninput = () => { sel = 0; draw(); };
  qi.onkeydown = e => { if (e.key==='ArrowDown'){ sel = Math.min(items.length-1, sel+1); draw(); e.preventDefault(); }
    else if (e.key==='ArrowUp'){ sel = Math.max(0, sel-1); draw(); e.preventDefault(); } else if (e.key==='Enter') pick(sel); };
  draw();
}

function tidy(root){
  root.querySelectorAll('.card > .hint, .card > div > .hint, section > .hint, .rc-mid > .hint, .rc-left > .hint').forEach(h => {
    if (h.dataset.tidy || h.closest('.tile, table, .pal-box, details')) return;
    h.dataset.tidy = 1;
    if (h.textContent.trim().length < 140) return;
    const d = document.createElement('details'); d.className = 'about';
    d.innerHTML = '<summary>ⓘ How this works</summary>';
    h.replaceWith(d); d.appendChild(h); h.style.marginTop = '4px';
  });
  root.querySelectorAll('td.l, th, .label, .k, .pcrow .k, .md-lab, .card > h3').forEach(el => {
    if (el.dataset.help) return;
    if (el.title || el.dataset.tip){ if (el.matches('th, .label')){ el.dataset.help = 1; el.classList.add('has-help'); } return; }
    const raw = el.textContent.replace(/[★☆↓]/g,'').trim().toLowerCase();
    const t = raw.replace(/\s*(\/ game|per game|in a game)$/i,'').replace(/^(most|total)\s+/i,'').trim();
    const h = DG_HELP[raw] || DG_HELP[t] || (STAT_HELP && STAT_HELP[t]); if (!h) return;
    el.dataset.help = 1; el.title = h; el.classList.add('has-help');
  });
}

    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px'; };
  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[title],[data-tip]');
    if (el && el.hasAttribute('title')){ el.dataset.tip = el.getAttribute('title'); el.removeAttribute('title'); }
    if (el === cur) return;
    cur = el;
    if (!el || !el.dataset.tip){ tip.classList.remove('on'); return; }
    tip.textContent = el.dataset.tip; tip.classList.add('on'); place(e);
  });
  document.addEventListener('mousemove', e => { if (cur) place(e); });
  document.addEventListener('mouseleave', () => { cur = null; tip.classList.remove('on'); });
  document.addEventListener('scroll', () => { cur = null; tip.classList.remove('on'); }, true);
  document.addEventListener('click', () => { cur = null; tip.classList.remove('on'); }, true);
})();
</script>
</body>
</html>
